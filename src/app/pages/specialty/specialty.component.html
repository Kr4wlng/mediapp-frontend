<router-outlet/>

<div [hidden]="checkChildren()">
  <mat-form-field>
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="idSpecialty">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.idSpecialty}} </td>
      </ng-container>

      <ng-container matColumnDef="nameSpecialty">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.nameSpecialty}} </td>
      </ng-container>

      <ng-container matColumnDef="descriptionSpecialty">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
        <td mat-cell *matCellDef="let element"> {{element.descriptionSpecialty}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> ACTIONS </th>
        <td mat-cell *matCellDef="let element">
          <button mat-button color="primary" [routerLink]="['edit', element.idSpecialty]">
              <mat-icon>mode_edit</mat-icon>
          </button>

          <button mat-button color="accent" (click)="delete(element.idMedic)">
              <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayColumns();"></tr>

  </table>

  <mat-paginator [pageSizeOptions]="[2, 5, 25, 100]" aria-label="Select page of specialties"></mat-paginator>

    <button mat-fab color="primary" style="float: right;" routerLink="/pages/specialty/new">
      <mat-icon>add</mat-icon>
    </button>
</div>
